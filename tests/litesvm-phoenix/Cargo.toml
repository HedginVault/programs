[package]
name = "hedge-vault-litesvm-phoenix"
version = "0.1.0"
edition = "2021"
publish = false

# Detached like tests/litesvm: the Phoenix fixture needs Solana 3.x crates, the program is on Solana 2.x.
[workspace]

[dependencies]
hedge_vault = { path = "../../programs/hedge_vault", features = ["no-entrypoint"] }
anchor-lang = "0.31.1"
base64 = "0.22"
bytemuck = "1"
phoenix-rise-litesvm-test = "=0.6.5"
litesvm = "0.16"
solana-clock = "3"
solana-instruction = "3"
solana-pubkey = "3"
solana-transaction-error = "3"
