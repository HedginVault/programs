[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
hedge_vault = "r2ahBQ6gbPCJ9FxBymYcXuwXi8NmenRry7SE7QR7FAt"

[programs.mainnet]
hedge_vault = "r2ahBQ6gbPCJ9FxBymYcXuwXi8NmenRry7SE7QR7FAt"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "mainnet"
wallet = "~/.config/solana/idm.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
test-litesvm = "anchor build && cargo test --manifest-path tests/litesvm/Cargo.toml"
initialize-config = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/handler/initialize_config.ts"
migrate-config = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/handler/migrate_config.ts"
update-config = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/handler/update_config.ts"
accept-admin = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/handler/accept_admin.ts"
