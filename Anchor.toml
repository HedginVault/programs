[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
hedge_vault = "r2ahBQ6gbPCJ9FxBymYcXuwXi8NmenRry7SE7QR7FAt"

[programs.mainnet]
hedge_vault = "r2ahBQ6gbPCJ9FxBymYcXuwXi8NmenRry7SE7QR7FAt"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "mainnet"
wallet = "~/.config/solana/idm.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
test-litesvm = "anchor build && cargo test --manifest-path tests/litesvm/Cargo.toml"
# first run fetches the mainnet Phoenix, Ember and Hawkeye binaries into tests/litesvm-phoenix/target
test-litesvm-phoenix = "anchor build && PHOENIX_MAINNET_BPF_PROGRAMS=1 cargo test --manifest-path tests/litesvm-phoenix/Cargo.toml"
config-initialize = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/handler/config_initialize.ts"
config-migrate = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/handler/config_migrate.ts"
config-update = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/handler/config_update.ts"
